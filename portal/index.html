<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://migranja-portal.migranja-events.workers.dev; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff portal | Mi Granja Events</title>
  <meta name="description" content="Staff portal for Mi Granja Events and Leisure Inc.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.migranjaevents.com/portal/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/portal.css">
    <script src="/assets/js/portal/framebust.js"></script>
  <script type="module" src="/assets/js/portal/app.js"></script>
</head>
<body class="portal-body">
  <div id="login-screen">
    <a class="skip-link" href="#login-main">Skip to content</a>
    <header class="portal-top">
      <div class="portal-top__inner">
        <a class="portal-brand" href="/">
          <img src="/assets/img/logo.webp" alt="Mi Granja Events and Leisure Inc." width="1309" height="1000">
          <span>
            <span class="portal-brand__name">Mi Granja Events</span>
            <span class="portal-brand__tag">Staff portal</span>
          </span>
        </a>
      </div>
    </header>
    <main class="login-main" id="login-main">
      <div class="portal-card login-card" data-login-panel></div>
    </main>
  </div>
  <div id="app-screen" hidden>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="portal-top">
      <div class="portal-top__inner">
        <button class="portal-nav-toggle" type="button" data-nav-toggle aria-controls="app-nav" aria-expanded="false">Menu</button>
        <a class="portal-brand" href="#/dashboard">
          <img src="/assets/img/logo.webp" alt="Mi Granja Events and Leisure Inc." width="1309" height="1000">
          <span>
            <span class="portal-brand__name">Mi Granja Events</span>
            <span class="portal-brand__tag">Staff portal</span>
          </span>
        </a>
        <div class="portal-user">
          <button class="btn btn-ghost portal-account-toggle" type="button" data-account-toggle aria-expanded="false" aria-controls="account-menu" aria-haspopup="true">Account</button>
          <div class="portal-account-menu" id="account-menu" data-account-menu hidden>
            <div class="portal-user__meta" data-user-meta></div>
            <button class="btn btn-ghost" type="button" data-logout-all>Sign out everywhere</button>
            <button class="btn btn-ghost" type="button" data-logout>Log out</button>
          </div>
        </div>
      </div>
    </header>
    <div class="demo-mode-bar" data-demo-bar hidden></div>
    <div class="portal-shell">
      <nav id="app-nav" class="portal-nav" data-nav hidden></nav>
      <main id="main" class="portal-main" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>
